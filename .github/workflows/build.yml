name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Create project files
        run: |
          mkdir -p "$(dirname 'settings.gradle.kts')"
          cat > 'settings.gradle.kts' <<'EOF_SV'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SoundVibe"
          include(":app")
          EOF_SV
          mkdir -p "$(dirname 'build.gradle.kts')"
          cat > 'build.gradle.kts' <<'EOF_SV'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_SV
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'EOF_SV'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF_SV
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          cat > 'app/build.gradle.kts' <<'EOF_SV'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.soundvibe"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.soundvibe"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 7
                  versionName = "4.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF_SV
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_SV'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.SoundVibe">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".VibeService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          EOF_SV
          mkdir -p "$(dirname 'app/src/main/java/com/example/soundvibe/MainActivity.kt')"
          cat > 'app/src/main/java/com/example/soundvibe/MainActivity.kt' <<'EOF_SV'
          package com.example.soundvibe

          import android.Manifest
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Vibrator
          import android.provider.Settings
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.RadioButton
          import android.widget.RadioGroup
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {

              private lateinit var statusText: TextView
              private lateinit var toggle: Button

              private val stateReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) = refreshUi()
              }

              private val projectionLauncher =
                  registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { result ->
                      val data = result.data
                      if (result.resultCode == RESULT_OK && data != null) {
                          val svc = Intent(this, VibeService::class.java)
                              .putExtra(VibeService.EXTRA_RESULT_CODE, result.resultCode)
                              .putExtra(VibeService.EXTRA_DATA, data)
                          ContextCompat.startForegroundService(this, svc)
                      }
                  }

              private val permissionLauncher =
                  registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { grants ->
                      if (grants[Manifest.permission.RECORD_AUDIO] == true) {
                          checkOverlayAndStart()
                      } else {
                          Toast.makeText(this, R.string.mic_denied, Toast.LENGTH_LONG).show()
                      }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  statusText = findViewById(R.id.statusText)
                  toggle = findViewById(R.id.toggleButton)
                  val sensBar = findViewById<SeekBar>(R.id.sensitivityBar)
                  val punchBar = findViewById<SeekBar>(R.id.punchBar)
                  val pulseBar = findViewById<SeekBar>(R.id.pulseBar)
                  val modeGroup = findViewById<RadioGroup>(R.id.modeGroup)

                  val edgeCheck = findViewById<CheckBox>(R.id.edgeGlowCheck)
                  val eqCheck = findViewById<CheckBox>(R.id.eqCheck)
                  val glowModeGroup = findViewById<RadioGroup>(R.id.glowModeGroup)
                  val widthBar = findViewById<SeekBar>(R.id.edgeWidthBar)

                  val prefs = getSharedPreferences(VibeService.PREFS, MODE_PRIVATE)
                  sensBar.progress = prefs.getInt(VibeService.KEY_SENS, 50)
                  punchBar.progress = prefs.getInt(VibeService.KEY_PUNCH, 60)
                  pulseBar.progress = prefs.getInt(VibeService.KEY_PULSE, 25)
                  edgeCheck.isChecked = prefs.getBoolean(VibeService.KEY_EDGE, true)
                  eqCheck.isChecked = prefs.getBoolean(VibeService.KEY_EQ, true)
                  widthBar.progress = prefs.getInt(VibeService.KEY_EDGE_WIDTH, 12)

                  when (prefs.getInt(VibeService.KEY_MODE, 0)) {
                      0 -> findViewById<RadioButton>(R.id.modeSubBass).isChecked = true
                      1 -> findViewById<RadioButton>(R.id.modeKick).isChecked = true
                      2 -> findViewById<RadioButton>(R.id.modeAll).isChecked = true
                  }

                  when (prefs.getInt(VibeService.KEY_GLOW_STYLE, 1)) {
                      0 -> findViewById<RadioButton>(R.id.styleStatic).isChecked = true
                      1 -> findViewById<RadioButton>(R.id.styleDisco).isChecked = true
                      2 -> findViewById<RadioButton>(R.id.styleRainbow).isChecked = true
                      3 -> findViewById<RadioButton>(R.id.styleStrobe).isChecked = true
                  }

                  sensBar.setOnSeekBarChangeListener(simpleListener { prefs.edit().putInt(VibeService.KEY_SENS, it).apply() })
                  punchBar.setOnSeekBarChangeListener(simpleListener { prefs.edit().putInt(VibeService.KEY_PUNCH, it).apply() })
                  pulseBar.setOnSeekBarChangeListener(simpleListener { prefs.edit().putInt(VibeService.KEY_PULSE, it.coerceAtLeast(15)).apply() })
                  widthBar.setOnSeekBarChangeListener(simpleListener { prefs.edit().putInt(VibeService.KEY_EDGE_WIDTH, it.coerceAtLeast(4)).apply() })

                  glowModeGroup.setOnCheckedChangeListener { _, id ->
                      val style = when (id) {
                          R.id.styleStatic -> 0
                          R.id.styleDisco -> 1
                          R.id.styleRainbow -> 2
                          else -> 3
                      }
                      prefs.edit().putInt(VibeService.KEY_GLOW_STYLE, style).apply()
                  }

                  edgeCheck.setOnCheckedChangeListener { _, checked ->
                      prefs.edit().putBoolean(VibeService.KEY_EDGE, checked).apply()
                      if (checked && !Settings.canDrawOverlays(this)) askOverlayPermission()
                  }

                  eqCheck.setOnCheckedChangeListener { _, checked ->
                      prefs.edit().putBoolean(VibeService.KEY_EQ, checked).apply()
                      if (checked && !Settings.canDrawOverlays(this)) askOverlayPermission()
                  }

                  modeGroup.setOnCheckedChangeListener { _, checkedId ->
                      val mode = when (checkedId) {
                          R.id.modeSubBass -> 0
                          R.id.modeKick -> 1
                          else -> 2
                      }
                      prefs.edit().putInt(VibeService.KEY_MODE, mode).apply()
                  }

                  toggle.setOnClickListener {
                      if (VibeService.isRunning) {
                          startService(Intent(this, VibeService::class.java).setAction(VibeService.ACTION_STOP))
                      } else {
                          startFlow()
                      }
                  }
              }

              private fun simpleListener(onChange: (Int) -> Unit) = object : SeekBar.OnSeekBarChangeListener {
                  override fun onProgressChanged(sb: SeekBar?, value: Int, fromUser: Boolean) = onChange(value)
                  override fun onStartTrackingTouch(sb: SeekBar?) {}
                  override fun onStopTrackingTouch(sb: SeekBar?) {}
              }

              private fun askOverlayPermission() {
                  val intent = Intent(
                      Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                      Uri.parse("package:$packageName")
                  )
                  startActivity(intent)
                  Toast.makeText(this, "يرجى منح إذن الظهور فوق التطبيقات لتفعيل المؤثرات والإيكولايزر", Toast.LENGTH_LONG).show()
              }

              private fun startFlow() {
                  val prefs = getSharedPreferences(VibeService.PREFS, MODE_PRIVATE)
                  if ((prefs.getBoolean(VibeService.KEY_EDGE, true) || prefs.getBoolean(VibeService.KEY_EQ, true)) && !Settings.canDrawOverlays(this)) {
                      askOverlayPermission()
                      return
                  }

                  @Suppress("DEPRECATION")
                  val vib = getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  if (!vib.hasVibrator()) {
                      Toast.makeText(this, R.string.no_vibrator, Toast.LENGTH_LONG).show()
                      return
                  }

                  val needed = mutableListOf<String>()
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED)
                      needed += Manifest.permission.RECORD_AUDIO
                  if (Build.VERSION.SDK_INT >= 33 && ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED)
                      needed += Manifest.permission.POST_NOTIFICATIONS

                  if (needed.isEmpty()) checkOverlayAndStart()
                  else permissionLauncher.launch(needed.toTypedArray())
              }

              private fun checkOverlayAndStart() {
                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  projectionLauncher.launch(mpm.createScreenCaptureIntent())
              }

              private fun refreshUi() {
                  val on = VibeService.isRunning
                  statusText.setText(if (on) R.string.status_on else R.string.status_off)
                  toggle.setText(if (on) R.string.stop else R.string.start)
              }

              override fun onStart() {
                  super.onStart()
                  ContextCompat.registerReceiver(
                      this, stateReceiver, IntentFilter(VibeService.ACTION_STATE),
                      ContextCompat.RECEIVER_NOT_EXPORTED
                  )
                  refreshUi()
              }

              override fun onStop() {
                  unregisterReceiver(stateReceiver)
                  super.onStop()
              }
          }
          EOF_SV
          mkdir -p "$(dirname 'app/src/main/java/com/example/soundvibe/EqualizerOverlayView.kt')"
          cat > 'app/src/main/java/com/example/soundvibe/EqualizerOverlayView.kt' <<'EOF_SV'
          package com.example.soundvibe

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.view.View

          class EqualizerOverlayView(context: Context) : View(context) {

              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val barCount = 18
              private val barHeights = FloatArray(barCount)

              private val discoPalette = intArrayOf(
                  Color.parseColor("#FF00E5FF"),
                  Color.parseColor("#FFFF1744"),
                  Color.parseColor("#FF00E676"),
                  Color.parseColor("#FFD500F9"),
                  Color.parseColor("#FFFFEA00")
              )

              fun updateBars(energy: Float, bassEnergy: Float) {
                  for (i in 0 until barCount) {
                      val ratio = if (i < 6) bassEnergy else energy * (1f + (i % 4) * 0.2f)
                      val target = (ratio * 1.5f).coerceIn(0.05f, 1f)
                      barHeights[i] = barHeights[i] * 0.7f + target * 0.3f
                  }
                  postInvalidate()
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val barWidth = (w / barCount) * 0.65f
                  val gap = (w / barCount) * 0.35f
                  val maxBarH = 140f

                  for (i in 0 until barCount) {
                      val left = i * (barWidth + gap) + gap / 2
                      val currentH = barHeights[i] * maxBarH
                      val top = h - currentH
                      paint.color = discoPalette[i % discoPalette.size]
                      paint.alpha = 200
                      canvas.drawRoundRect(left, top, left + barWidth, h, 8f, 8f, paint)
                  }
              }
          }
          EOF_SV
          mkdir -p "$(dirname 'app/src/main/java/com/example/soundvibe/VibeService.kt')"
          cat > 'app/src/main/java/com/example/soundvibe/VibeService.kt' <<'EOF_SV'
          package com.example.soundvibe

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioPlaybackCaptureConfiguration
          import android.media.AudioRecord
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import androidx.core.app.NotificationCompat
          import kotlin.math.sqrt
          import kotlin.random.Random

          class VibeService : Service() {

              private var projection: MediaProjection? = null
              private var recorder: AudioRecord? = null
              private var worker: Thread? = null
              @Volatile private var running = false

              private lateinit var vibrator: Vibrator
              private var windowManager: WindowManager? = null
              private var edgeOverlay: View? = null
              private var eqOverlay: EqualizerOverlayView? = null
              private val mainHandler = Handler(Looper.getMainLooper())

              private val discoColors = intArrayOf(
                  Color.parseColor("#FF00E5FF"), // سماوي
                  Color.parseColor("#FFFF0055"), // أحمر نيون
                  Color.parseColor("#FF00FF66"), // أخضر فوسفوري
                  Color.parseColor("#FFAA00FF"), // موف نيون
                  Color.parseColor("#FFFFEE00"), // أصفر
                  Color.parseColor("#FFFF6600")  // برتقالي ناري
              )
              private var currentColorIdx = 0

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  vibrator = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      (getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as VibratorManager).defaultVibrator
                  } else {
                      @Suppress("DEPRECATION")
                      getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  }
                  setupOverlays()
              }

              private fun setupOverlays() {
                  if (!Settings.canDrawOverlays(this)) return
                  try {
                      windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                      val baseFlags = WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS

                      val windowType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                      else
                          @Suppress("DEPRECATION")
                          WindowManager.LayoutParams.TYPE_PHONE

                      // 1. شاشة إضاءة الحواف
                      val edgeParams = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.MATCH_PARENT,
                          windowType,
                          baseFlags,
                          PixelFormat.TRANSLUCENT
                      )
                      edgeOverlay = View(this).apply { visibility = View.GONE }
                      windowManager?.addView(edgeOverlay, edgeParams)

                      // 2. إيكولايزر أسفل الشاشة
                      val eqParams = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT,
                          260,
                          windowType,
                          baseFlags,
                          PixelFormat.TRANSLUCENT
                      ).apply {
                          gravity = Gravity.BOTTOM
                      }
                      eqOverlay = EqualizerOverlayView(this).apply { visibility = View.GONE }
                      windowManager?.addView(eqOverlay, eqParams)
                  } catch (_: Exception) {}
              }

              private fun triggerGlow(durationMs: Long) {
                  edgeOverlay?.let { view ->
                      mainHandler.post {
                          val prefs = getSharedPreferences(PREFS, MODE_PRIVATE)
                          val style = prefs.getInt(KEY_GLOW_STYLE, 1) // 1: Disco
                          val strokeDp = prefs.getInt(KEY_EDGE_WIDTH, 12)
                          val strokePx = (strokeDp * resources.displayMetrics.density).toInt()

                          val selectedColor = when (style) {
                              1 -> { // ديسكو عشوائي مع كل ضربة
                                  discoColors[Random.nextInt(discoColors.size)]
                              }
                              2 -> { // رينبو تدريجي
                                  currentColorIdx = (currentColorIdx + 1) % discoColors.size
                                  discoColors[currentColorIdx]
                              }
                              3 -> Color.WHITE // وميض ستروب
                              else -> Color.parseColor("#FF00E5FF") // سماوي كلاسيكي
                          }

                          val shape = GradientDrawable().apply {
                              shape = GradientDrawable.RECTANGLE
                              setStroke(strokePx, selectedColor)
                              setColor(if (style == 1) Color.argb(30, Color.red(selectedColor), Color.green(selectedColor), Color.blue(selectedColor)) else Color.TRANSPARENT)
                          }
                          view.background = shape
                          view.visibility = View.VISIBLE
                          view.alpha = 1.0f
                      }
                      mainHandler.postDelayed({
                          view.animate().alpha(0f).setDuration(durationMs).withEndAction {
                              view.visibility = View.GONE
                          }.start()
                      }, durationMs)
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  val resultCode = intent?.getIntExtra(EXTRA_RESULT_CODE, 0) ?: 0
                  val data: Intent? = if (Build.VERSION.SDK_INT >= 33) {
                      intent?.getParcelableExtra(EXTRA_DATA, Intent::class.java)
                  } else {
                      @Suppress("DEPRECATION")
                      intent?.getParcelableExtra(EXTRA_DATA)
                  }
                  if (data == null || running) {
                      if (data == null) stopSelf()
                      return START_NOT_STICKY
                  }

                  startForegroundCompat()

                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  projection = mpm.getMediaProjection(resultCode, data)
                  projection?.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() { stopSelf() }
                  }, null)

                  if (!startCapture()) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  return START_NOT_STICKY
              }

              private fun startCapture(): Boolean {
                  val proj = projection ?: return false

                  val config = AudioPlaybackCaptureConfiguration.Builder(proj)
                      .addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                      .addMatchingUsage(AudioAttributes.USAGE_GAME)
                      .addMatchingUsage(AudioAttributes.USAGE_UNKNOWN)
                      .build()

                  val format = AudioFormat.Builder()
                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                      .setSampleRate(SAMPLE_RATE)
                      .setChannelMask(AudioFormat.CHANNEL_IN_MONO)
                      .build()

                  val minBuf = AudioRecord.getMinBufferSize(
                      SAMPLE_RATE, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT
                  )
                  val chunk = SAMPLE_RATE / 50

                  val rec = try {
                      AudioRecord.Builder()
                          .setAudioPlaybackCaptureConfig(config)
                          .setAudioFormat(format)
                          .setBufferSizeInBytes(maxOf(minBuf, chunk * 2 * 4))
                          .build()
                  } catch (e: Exception) {
                      return false
                  }
                  if (rec.state != AudioRecord.STATE_INITIALIZED) {
                      rec.release()
                      return false
                  }

                  recorder = rec
                  running = true
                  isRunning = true
                  rec.startRecording()
                  sendBroadcast(Intent(ACTION_STATE).setPackage(packageName))

                  mainHandler.post {
                      if (getSharedPreferences(PREFS, MODE_PRIVATE).getBoolean(KEY_EQ, true)) {
                          eqOverlay?.visibility = View.VISIBLE
                      }
                  }

                  worker = Thread({ loop(rec, chunk) }, "SoundVibeMaster").also { it.start() }
                  return true
              }

              private fun loop(rec: AudioRecord, chunk: Int) {
                  val buf = ShortArray(chunk)
                  val prefs = getSharedPreferences(PREFS, MODE_PRIVATE)
                  val hasAmp = vibrator.hasAmplitudeControl()

                  var lp1 = 0f
                  var lp2 = 0f
                  var avgEnergy = 0.05f
                  var lastBeatTime = 0L

                  while (running) {
                      val n = rec.read(buf, 0, chunk)
                      if (n <= 0) continue

                      val mode = prefs.getInt(KEY_MODE, 0)
                      val sens = prefs.getInt(KEY_SENS, 50)
                      val punch = prefs.getInt(KEY_PUNCH, 60)
                      val pulseMs = prefs.getInt(KEY_PULSE, 25).toLong()
                      val edgeEnabled = prefs.getBoolean(KEY_EDGE, true)
                      val eqEnabled = prefs.getBoolean(KEY_EQ, true)

                      val alpha = when (mode) {
                          0 -> 0.009f
                          1 -> 0.025f
                          else -> 1.0f
                      }
                      val boost = when (mode) {
                          0 -> 24f
                          1 -> 14f
                          else -> 1.5f
                      }

                      var sumTotal = 0.0
                      var sumBass = 0.0

                      for (i in 0 until n) {
                          val raw = buf[i] / 32768f
                          sumTotal += (raw * raw).toDouble()

                          lp1 += alpha * (raw - lp1)
                          lp2 += alpha * (lp1 - lp2)
                          val bassFiltered = lp2 * boost
                          sumBass += (bassFiltered * bassFiltered).toDouble()
                      }

                      val rawEnergy = sqrt(sumTotal / n).toFloat()
                      val bassEnergy = sqrt(sumBass / n).toFloat()

                      // تحديث الإيكولايزر المرئي
                      if (eqEnabled) {
                          mainHandler.post { eqOverlay?.updateBars(rawEnergy, bassEnergy) }
                      }

                      val effectiveEnergy = if (mode == 2) rawEnergy else bassEnergy
                      avgEnergy = avgEnergy * 0.94f + effectiveEnergy * 0.06f

                      val thresholdMultiplier = 1.3f + (punch / 100f) * 1.7f
                      val dynamicThreshold = avgEnergy * thresholdMultiplier
                      val minFloor = 0.04f + (punch / 100f) * 0.08f

                      val now = System.currentTimeMillis()
                      val isHit = effectiveEnergy > dynamicThreshold && effectiveEnergy > minFloor
                      val cooldown = pulseMs + 90L

                      if (isHit && (now - lastBeatTime > cooldown)) {
                          lastBeatTime = now
                          val amp = if (hasAmp) {
                              val sensMultiplier = 0.8f + (sens / 100f) * 1.5f
                              ((effectiveEnergy * sensMultiplier).coerceIn(0.2f, 1f) * 255f).toInt()
                          } else 255

                          try {
                              if (hasAmp) {
                                  vibrator.vibrate(VibrationEffect.createOneShot(pulseMs, amp))
                              } else {
                                  vibrator.vibrate(VibrationEffect.createOneShot(pulseMs, VibrationEffect.DEFAULT_AMPLITUDE))
                              }
                          } catch (_: Exception) {}

                          if (edgeEnabled) {
                              triggerGlow(pulseMs + 45L)
                          }
                      }
                  }
              }

              private fun startForegroundCompat() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel(CHANNEL_ID, getString(R.string.notif_channel), NotificationManager.IMPORTANCE_LOW)
                  )
                  val stopIntent = Intent(this, VibeService::class.java).setAction(ACTION_STOP)
                  val stopPi = android.app.PendingIntent.getService(
                      this, 0, stopIntent,
                      android.app.PendingIntent.FLAG_IMMUTABLE or android.app.PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val openPi = android.app.PendingIntent.getActivity(
                      this, 1, Intent(this, MainActivity::class.java),
                      android.app.PendingIntent.FLAG_IMMUTABLE
                  )
                  val notification: Notification = NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_lock_silent_mode_off)
                      .setContentTitle(getString(R.string.notif_title))
                      .setContentText(getString(R.string.notif_text))
                      .setContentIntent(openPi)
                      .addAction(0, getString(R.string.stop), stopPi)
                      .setOngoing(true)
                      .build()

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(NOTIF_ID, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(NOTIF_ID, notification)
                  }
              }

              override fun onDestroy() {
                  running = false
                  try { worker?.join(300) } catch (_: InterruptedException) {}
                  try { recorder?.stop() } catch (_: Exception) {}
                  recorder?.release()
                  recorder = null
                  projection?.stop()
                  projection = null
                  vibrator.cancel()
                  isRunning = false

                  mainHandler.post {
                      edgeOverlay?.let { windowManager?.removeView(it); edgeOverlay = null }
                      eqOverlay?.let { windowManager?.removeView(it); eqOverlay = null }
                  }

                  sendBroadcast(Intent(ACTION_STATE).setPackage(packageName))
                  super.onDestroy()
              }

              companion object {
                  const val ACTION_STOP = "com.example.soundvibe.STOP"
                  const val ACTION_STATE = "com.example.soundvibe.STATE"
                  const val EXTRA_RESULT_CODE = "result_code"
                  const val EXTRA_DATA = "data"

                  const val PREFS = "soundvibe"
                  const val KEY_SENS = "sensitivity"
                  const val KEY_PUNCH = "punch"
                  const val KEY_PULSE = "pulse"
                  const val KEY_MODE = "mode"
                  const val KEY_EDGE = "edge_glow"
                  const val KEY_EQ = "show_eq"
                  const val KEY_GLOW_STYLE = "glow_style"
                  const val KEY_EDGE_WIDTH = "edge_width"

                  private const val CHANNEL_ID = "vibe"
                  private const val NOTIF_ID = 1
                  private const val SAMPLE_RATE = 44100

                  @Volatile var isRunning = false
              }
          }
          EOF_SV
