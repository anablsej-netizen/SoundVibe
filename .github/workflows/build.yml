name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Create project files
        run: |
          mkdir -p "$(dirname 'settings.gradle.kts')"
          cat > 'settings.gradle.kts' <<'EOF_SV'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SoundVibe"
          include(":app")
          EOF_SV
          mkdir -p "$(dirname 'build.gradle.kts')"
          cat > 'build.gradle.kts' <<'EOF_SV'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_SV
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'EOF_SV'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF_SV
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          cat > 'app/build.gradle.kts' <<'EOF_SV'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.soundvibe"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.soundvibe"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 4
                  versionName = "2.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF_SV
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_SV'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.SoundVibe">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".VibeService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          EOF_SV
          mkdir -p "$(dirname 'app/src/main/java/com/example/soundvibe/MainActivity.kt')"
          cat > 'app/src/main/java/com/example/soundvibe/MainActivity.kt' <<'EOF_SV'
          package com.example.soundvibe

          import android.Manifest
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Bundle
          import android.os.Vibrator
          import android.widget.Button
          import android.widget.RadioButton
          import android.widget.RadioGroup
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {

              private lateinit var statusText: TextView
              private lateinit var toggle: Button

              private val stateReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) = refreshUi()
              }

              private val projectionLauncher =
                  registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { result ->
                      val data = result.data
                      if (result.resultCode == RESULT_OK && data != null) {
                          val svc = Intent(this, VibeService::class.java)
                              .putExtra(VibeService.EXTRA_RESULT_CODE, result.resultCode)
                              .putExtra(VibeService.EXTRA_DATA, data)
                          ContextCompat.startForegroundService(this, svc)
                      }
                  }

              private val permissionLauncher =
                  registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { grants ->
                      if (grants[Manifest.permission.RECORD_AUDIO] == true) {
                          requestProjection()
                      } else {
                          Toast.makeText(this, R.string.mic_denied, Toast.LENGTH_LONG).show()
                      }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  statusText = findViewById(R.id.statusText)
                  toggle = findViewById(R.id.toggleButton)
                  val sensBar = findViewById<SeekBar>(R.id.sensitivityBar)
                  val punchBar = findViewById<SeekBar>(R.id.punchBar)
                  val pulseBar = findViewById<SeekBar>(R.id.pulseBar)
                  val modeGroup = findViewById<RadioGroup>(R.id.modeGroup)
                  val modeSub = findViewById<RadioButton>(R.id.modeSubBass)
                  val modeKick = findViewById<RadioButton>(R.id.modeKick)
                  val modeAll = findViewById<RadioButton>(R.id.modeAll)

                  val prefs = getSharedPreferences(VibeService.PREFS, MODE_PRIVATE)
                  sensBar.progress = prefs.getInt(VibeService.KEY_SENS, 50)
                  punchBar.progress = prefs.getInt(VibeService.KEY_PUNCH, 60)
                  pulseBar.progress = prefs.getInt(VibeService.KEY_PULSE, 25)

                  when (prefs.getInt(VibeService.KEY_MODE, 0)) {
                      0 -> modeSub.isChecked = true
                      1 -> modeKick.isChecked = true
                      2 -> modeAll.isChecked = true
                  }

                  sensBar.setOnSeekBarChangeListener(simpleListener { prefs.edit().putInt(VibeService.KEY_SENS, it).apply() })
                  punchBar.setOnSeekBarChangeListener(simpleListener { prefs.edit().putInt(VibeService.KEY_PUNCH, it).apply() })
                  pulseBar.setOnSeekBarChangeListener(simpleListener { prefs.edit().putInt(VibeService.KEY_PULSE, it.coerceAtLeast(15)).apply() })

                  modeGroup.setOnCheckedChangeListener { _, checkedId ->
                      val mode = when (checkedId) {
                          R.id.modeSubBass -> 0
                          R.id.modeKick -> 1
                          else -> 2
                      }
                      prefs.edit().putInt(VibeService.KEY_MODE, mode).apply()
                  }

                  toggle.setOnClickListener {
                      if (VibeService.isRunning) {
                          startService(Intent(this, VibeService::class.java).setAction(VibeService.ACTION_STOP))
                      } else {
                          startFlow()
                      }
                  }
              }

              private fun simpleListener(onChange: (Int) -> Unit) = object : SeekBar.OnSeekBarChangeListener {
                  override fun onProgressChanged(sb: SeekBar?, value: Int, fromUser: Boolean) = onChange(value)
                  override fun onStartTrackingTouch(sb: SeekBar?) {}
                  override fun onStopTrackingTouch(sb: SeekBar?) {}
              }

              private fun startFlow() {
                  @Suppress("DEPRECATION")
                  val vib = getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  if (!vib.hasVibrator()) {
                      Toast.makeText(this, R.string.no_vibrator, Toast.LENGTH_LONG).show()
                      return
                  }

                  val needed = mutableListOf<String>()
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED)
                      needed += Manifest.permission.RECORD_AUDIO
                  if (Build.VERSION.SDK_INT >= 33 && ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED)
                      needed += Manifest.permission.POST_NOTIFICATIONS

                  if (needed.isEmpty()) requestProjection()
                  else permissionLauncher.launch(needed.toTypedArray())
              }

              private fun requestProjection() {
                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  projectionLauncher.launch(mpm.createScreenCaptureIntent())
              }

              private fun refreshUi() {
                  val on = VibeService.isRunning
                  statusText.setText(if (on) R.string.status_on else R.string.status_off)
                  toggle.setText(if (on) R.string.stop else R.string.start)
              }

              override fun onStart() {
                  super.onStart()
                  ContextCompat.registerReceiver(
                      this, stateReceiver, IntentFilter(VibeService.ACTION_STATE),
                      ContextCompat.RECEIVER_NOT_EXPORTED
                  )
                  refreshUi()
              }

              override fun onStop() {
                  unregisterReceiver(stateReceiver)
                  super.onStop()
              }
          }
          EOF_SV
          mkdir -p "$(dirname 'app/src/main/java/com/example/soundvibe/VibeService.kt')"
          cat > 'app/src/main/java/com/example/soundvibe/VibeService.kt' <<'EOF_SV'
          package com.example.soundvibe

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioPlaybackCaptureConfiguration
          import android.media.AudioRecord
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.IBinder
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import androidx.core.app.NotificationCompat
          import kotlin.math.sqrt

          class VibeService : Service() {

              private var projection: MediaProjection? = null
              private var recorder: AudioRecord? = null
              private var worker: Thread? = null
              @Volatile private var running = false

              private lateinit var vibrator: Vibrator

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  vibrator = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      (getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as VibratorManager).defaultVibrator
                  } else {
                      @Suppress("DEPRECATION")
                      getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  val resultCode = intent?.getIntExtra(EXTRA_RESULT_CODE, 0) ?: 0
                  val data: Intent? = if (Build.VERSION.SDK_INT >= 33) {
                      intent?.getParcelableExtra(EXTRA_DATA, Intent::class.java)
                  } else {
                      @Suppress("DEPRECATION")
                      intent?.getParcelableExtra(EXTRA_DATA)
                  }
                  if (data == null || running) {
                      if (data == null) stopSelf()
                      return START_NOT_STICKY
                  }

                  startForegroundCompat()

                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  projection = mpm.getMediaProjection(resultCode, data)
                  projection?.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() { stopSelf() }
                  }, null)

                  if (!startCapture()) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  return START_NOT_STICKY
              }

              private fun startCapture(): Boolean {
                  val proj = projection ?: return false

                  val config = AudioPlaybackCaptureConfiguration.Builder(proj)
                      .addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                      .addMatchingUsage(AudioAttributes.USAGE_GAME)
                      .addMatchingUsage(AudioAttributes.USAGE_UNKNOWN)
                      .build()

                  val format = AudioFormat.Builder()
                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                      .setSampleRate(SAMPLE_RATE)
                      .setChannelMask(AudioFormat.CHANNEL_IN_MONO)
                      .build()

                  val minBuf = AudioRecord.getMinBufferSize(
                      SAMPLE_RATE, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT
                  )
                  val chunk = SAMPLE_RATE / 50

                  val rec = try {
                      AudioRecord.Builder()
                          .setAudioPlaybackCaptureConfig(config)
                          .setAudioFormat(format)
                          .setBufferSizeInBytes(maxOf(minBuf, chunk * 2 * 4))
                          .build()
                  } catch (e: Exception) {
                      return false
                  }
                  if (rec.state != AudioRecord.STATE_INITIALIZED) {
                      rec.release()
                      return false
                  }

                  recorder = rec
                  running = true
                  isRunning = true
                  rec.startRecording()
                  sendBroadcast(Intent(ACTION_STATE).setPackage(packageName))

                  worker = Thread({ loop(rec, chunk) }, "SoundVibeDSP").also { it.start() }
                  return true
              }

              private fun loop(rec: AudioRecord, chunk: Int) {
                  val buf = ShortArray(chunk)
                  val prefs = getSharedPreferences(PREFS, MODE_PRIVATE)
                  val hasAmp = vibrator.hasAmplitudeControl()

                  var lp1 = 0f
                  var lp2 = 0f
                  var avgEnergy = 0.05f
                  var lastBeatTime = 0L

                  while (running) {
                      val n = rec.read(buf, 0, chunk)
                      if (n <= 0) continue

                      val mode = prefs.getInt(KEY_MODE, 0) // 0: Sub-bass, 1: Kick, 2: All
                      val sens = prefs.getInt(KEY_SENS, 50)
                      val punch = prefs.getInt(KEY_PUNCH, 60) // عتبة الضربة
                      val pulseMs = prefs.getInt(KEY_PULSE, 25).toLong()

                      // معامل الفلترة حسب النمط
                      val alpha = when (mode) {
                          0 -> 0.009f // عزل تام تحت ~60Hz
                          1 -> 0.025f // حتى ~130Hz
                          else -> 1.0f
                      }
                      val boost = when (mode) {
                          0 -> 24f
                          1 -> 14f
                          else -> 1.5f
                      }

                      var sum = 0.0
                      for (i in 0 until n) {
                          var s = buf[i] / 32768f
                          if (mode != 2) {
                              lp1 += alpha * (s - lp1)
                              lp2 += alpha * (lp1 - lp2)
                              s = lp2 * boost
                          }
                          sum += (s * s).toDouble()
                      }
                      val energy = sqrt(sum / n).toFloat()

                      avgEnergy = avgEnergy * 0.94f + energy * 0.06f

                      // حساب متى تعتبر ضربة حادة
                      val thresholdMultiplier = 1.3f + (punch / 100f) * 1.7f
                      val dynamicThreshold = avgEnergy * thresholdMultiplier
                      val minFloor = 0.04f + (punch / 100f) * 0.08f

                      val now = System.currentTimeMillis()
                      val isHit = energy > dynamicThreshold && energy > minFloor
                      val cooldown = pulseMs + 90L // سكون إجباري بعد كل نبضة

                      if (isHit && (now - lastBeatTime > cooldown)) {
                          lastBeatTime = now
                          val amp = if (hasAmp) {
                              val sensMultiplier = 0.8f + (sens / 100f) * 1.5f
                              ((energy * sensMultiplier).coerceIn(0.2f, 1f) * 255f).toInt()
                          } else 255

                          try {
                              if (hasAmp) {
                                  vibrator.vibrate(VibrationEffect.createOneShot(pulseMs, amp))
                              } else {
                                  vibrator.vibrate(VibrationEffect.createOneShot(pulseMs, VibrationEffect.DEFAULT_AMPLITUDE))
                              }
                          } catch (_: Exception) {}
                      }
                  }
              }

              private fun startForegroundCompat() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel(CHANNEL_ID, getString(R.string.notif_channel), NotificationManager.IMPORTANCE_LOW)
                  )
                  val stopIntent = Intent(this, VibeService::class.java).setAction(ACTION_STOP)
                  val stopPi = android.app.PendingIntent.getService(
                      this, 0, stopIntent,
                      android.app.PendingIntent.FLAG_IMMUTABLE or android.app.PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val openPi = android.app.PendingIntent.getActivity(
                      this, 1, Intent(this, MainActivity::class.java),
                      android.app.PendingIntent.FLAG_IMMUTABLE
                  )
                  val notification: Notification = NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_lock_silent_mode_off)
                      .setContentTitle(getString(R.string.notif_title))
                      .setContentText(getString(R.string.notif_text))
                      .setContentIntent(openPi)
                      .addAction(0, getString(R.string.stop), stopPi)
                      .setOngoing(true)
                      .build()

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(NOTIF_ID, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(NOTIF_ID, notification)
                  }
              }

              override fun onDestroy() {
                  running = false
                  try { worker?.join(300) } catch (_: InterruptedException) {}
                  try { recorder?.stop() } catch (_: Exception) {}
                  recorder?.release()
                  recorder = null
                  projection?.stop()
                  projection = null
                  vibrator.cancel()
                  isRunning = false
                  sendBroadcast(Intent(ACTION_STATE).setPackage(packageName))
                  super.onDestroy()
              }

              companion object {
                  const val ACTION_STOP = "com.example.soundvibe.STOP"
                  const val ACTION_STATE = "com.example.soundvibe.STATE"
                  const val EXTRA_RESULT_CODE = "result_code"
                  const val EXTRA_DATA = "data"

                  const val PREFS = "soundvibe"
                  const val KEY_SENS = "sensitivity"
                  const val KEY_PUNCH = "punch"
                  const val KEY_PULSE = "pulse"
                  const val KEY_MODE = "mode"

                  private const val CHANNEL_ID = "vibe"
                  private const val NOTIF_ID = 1
                  private const val SAMPLE_RATE = 44100

                  @Volatile var isRunning = false
              }
          }
          EOF_SV
          mkdir -p "$(dirname 'app/src/main/res/layout/activity_main.xml')"
          cat > 'app/src/main/res/layout/activity_main.xml' <<'EOF_SV'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:fillViewport="true">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="24dp">

                  <TextView
                      android:id="@+id/statusText"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="20dp"
                      android:gravity="center"
                      android:text="@string/status_off"
                      android:textSize="20sp" />

                  <Button
                      android:id="@+id/toggleButton"
                      android:layout_width="match_parent"
                      android:layout_height="60dp"
                      android:layout_marginTop="20dp"
                      android:text="@string/start"
                      android:textSize="18sp" />

                  <!-- نمط التردد -->
                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="28dp"
                      android:text="@string/freq_mode"
                      android:textStyle="bold"
                      android:textSize="16sp" />

                  <RadioGroup
                      android:id="@+id/modeGroup"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp">

                      <RadioButton
                          android:id="@+id/modeSubBass"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="@string/mode_sub" />

                      <RadioButton
                          android:id="@+id/modeKick"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="@string/mode_kick" />

                      <RadioButton
                          android:id="@+id/modeAll"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="@string/mode_all" />
                  </RadioGroup>

                  <!-- قوة ضربة البيز -->
                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="20dp"
                      android:text="@string/punch_threshold"
                      android:textSize="15sp" />

                  <SeekBar
                      android:id="@+id/punchBar"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:max="100"
                      android:progress="60" />

                  <!-- سرعة/مدة النبضة -->
                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="16dp"
                      android:text="@string/pulse_speed"
                      android:textSize="15sp" />

                  <SeekBar
                      android:id="@+id/pulseBar"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:max="60"
                      android:progress="25" />

                  <!-- الحساسية العامة -->
                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="16dp"
                      android:text="@string/sensitivity"
                      android:textSize="15sp" />

                  <SeekBar
                      android:id="@+id/sensitivityBar"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:max="100"
                      android:progress="50" />

              </LinearLayout>
          </ScrollView>
          EOF_SV
          mkdir -p "$(dirname 'app/src/main/res/values/strings.xml')"
          cat > 'app/src/main/res/values/strings.xml' <<'EOF_SV'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">صوت لرجاج</string>
              <string name="start">تشغيل</string>
              <string name="stop">إيقاف</string>
              <string name="status_off">متوقف</string>
              <string name="status_on">شغّال — التقاط البيز نشط</string>
              <string name="freq_mode">نطاق التردد (نوع الصوت):</string>
              <string name="mode_sub">بيز عميق فقط (Sub-Bass &lt; 60Hz - الأنسب للرجاج)</string>
              <string name="mode_kick">ضربات الطبل والإيقاع (Kick &lt; 130Hz)</string>
              <string name="mode_all">كامل الصوت (كل الترددات)</string>
              <string name="punch_threshold">عتبة الضربة (ارفع السلايدر لمنع الرجة المستمرة):</string>
              <string name="pulse_speed">مدة النبضة (يسار: نقرة سريعة | يمين: هزة أطول):</string>
              <string name="sensitivity">حساسية الالتقاط العامة:</string>
              <string name="notif_title">صوت لرجاج شغّال</string>
              <string name="notif_text">الهاتف يهتز مع ضربات البيز</string>
              <string name="notif_channel">خدمة الاهتزاز</string>
              <string name="mic_denied">لازم تعطي صلاحية الصوت عشان يشتغل التطبيق</string>
              <string name="no_vibrator">هاتفك ما فيه محرك اهتزاز</string>
          </resources>
          EOF_SV
          mkdir -p "$(dirname 'app/src/main/res/values/themes.xml')"
          cat > 'app/src/main/res/values/themes.xml' <<'EOF_SV'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.SoundVibe" parent="Theme.Material3.DayNight.NoActionBar" />
          </resources>
          EOF_SV

      - name: Build APK with Gradle
        run: gradle :app:assembleDebug

      - name: Prepare APK Output
        run: |
          mkdir -p output_apk
          find . -name "*.apk" -exec cp {} output_apk/SoundVibe.apk \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoundVibe-APK
          path: output_apk/SoundVibe.apk
          if-no-files-found: error
