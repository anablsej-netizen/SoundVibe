name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Create project files
        run: |
          mkdir -p "$(dirname 'settings.gradle.kts')"
          cat > 'settings.gradle.kts' <<'EOF_SV'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SoundVibe"
          include(":app")
          EOF_SV
          mkdir -p "$(dirname 'build.gradle.kts')"
          cat > 'build.gradle.kts' <<'EOF_SV'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_SV
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'EOF_SV'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF_SV
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          cat > 'app/build.gradle.kts' <<'EOF_SV'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.soundvibe"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.soundvibe"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 3
                  versionName = "1.2"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF_SV
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_SV'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.SoundVibe">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".VibeService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          EOF_SV
          mkdir -p "$(dirname 'app/src/main/java/com/example/soundvibe/MainActivity.kt')"
          cat > 'app/src/main/java/com/example/soundvibe/MainActivity.kt' <<'EOF_SV'
          package com.example.soundvibe

          import android.Manifest
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Bundle
          import android.os.Vibrator
          import android.widget.Button
          import android.widget.RadioGroup
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {

              private lateinit var statusText: TextView
              private lateinit var toggle: Button

              private val stateReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) = refreshUi()
              }

              private val projectionLauncher =
                  registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { result ->
                      val data = result.data
                      if (result.resultCode == RESULT_OK && data != null) {
                          val svc = Intent(this, VibeService::class.java)
                              .putExtra(VibeService.EXTRA_RESULT_CODE, result.resultCode)
                              .putExtra(VibeService.EXTRA_DATA, data)
                          ContextCompat.startForegroundService(this, svc)
                      }
                  }

              private val permissionLauncher =
                  registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { grants ->
                      if (grants[Manifest.permission.RECORD_AUDIO] == true) {
                          requestProjection()
                      } else {
                          Toast.makeText(this, R.string.mic_denied, Toast.LENGTH_LONG).show()
                      }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  statusText = findViewById(R.id.statusText)
                  toggle = findViewById(R.id.toggleButton)
                  val sensBar = findViewById<SeekBar>(R.id.sensitivityBar)
                  val strengthBar = findViewById<SeekBar>(R.id.strengthBar)
                  val modeGroup = findViewById<RadioGroup>(R.id.modeGroup)

                  val prefs = getSharedPreferences(VibeService.PREFS, MODE_PRIVATE)
                  sensBar.progress = prefs.getInt(VibeService.KEY_SENS, 25)
                  strengthBar.progress = prefs.getInt(VibeService.KEY_STRENGTH, 70)

                  when (prefs.getInt(VibeService.KEY_MODE, VibeService.MODE_SUB_BASS)) {
                      VibeService.MODE_SUB_BASS -> modeGroup.check(R.id.modeSubBass)
                      VibeService.MODE_PUNCHY -> modeGroup.check(R.id.modePunchy)
                      VibeService.MODE_GAMING -> modeGroup.check(R.id.modeGaming)
                      VibeService.MODE_FULL -> modeGroup.check(R.id.modeFull)
                  }

                  sensBar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, value: Int, fromUser: Boolean) {
                          prefs.edit().putInt(VibeService.KEY_SENS, value).apply()
                      }
                      override fun onStartTrackingTouch(sb: SeekBar?) {}
                      override fun onStopTrackingTouch(sb: SeekBar?) {}
                  })

                  strengthBar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, value: Int, fromUser: Boolean) {
                          prefs.edit().putInt(VibeService.KEY_STRENGTH, value).apply()
                      }
                      override fun onStartTrackingTouch(sb: SeekBar?) {}
                      override fun onStopTrackingTouch(sb: SeekBar?) {}
                  })

                  modeGroup.setOnCheckedChangeListener { _, checkedId ->
                      val mode = when (checkedId) {
                          R.id.modePunchy -> VibeService.MODE_PUNCHY
                          R.id.modeGaming -> VibeService.MODE_GAMING
                          R.id.modeFull -> VibeService.MODE_FULL
                          else -> VibeService.MODE_SUB_BASS
                      }
                      prefs.edit().putInt(VibeService.KEY_MODE, mode).apply()
                  }

                  toggle.setOnClickListener {
                      if (VibeService.isRunning) {
                          startService(Intent(this, VibeService::class.java).setAction(VibeService.ACTION_STOP))
                      } else {
                          startFlow()
                      }
                  }
              }

              private fun startFlow() {
                  @Suppress("DEPRECATION")
                  val vib = getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  if (!vib.hasVibrator()) {
                      Toast.makeText(this, R.string.no_vibrator, Toast.LENGTH_LONG).show()
                      return
                  }

                  val needed = mutableListOf<String>()
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO)
                      != PackageManager.PERMISSION_GRANTED
                  ) needed += Manifest.permission.RECORD_AUDIO
                  if (Build.VERSION.SDK_INT >= 33 &&
                      ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS)
                      != PackageManager.PERMISSION_GRANTED
                  ) needed += Manifest.permission.POST_NOTIFICATIONS

                  if (needed.isEmpty()) requestProjection()
                  else permissionLauncher.launch(needed.toTypedArray())
              }

              private fun requestProjection() {
                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  projectionLauncher.launch(mpm.createScreenCaptureIntent())
              }

              private fun refreshUi() {
                  val on = VibeService.isRunning
                  statusText.setText(if (on) R.string.status_on else R.string.status_off)
                  toggle.setText(if (on) R.string.stop else R.string.start)
              }

              override fun onStart() {
                  super.onStart()
                  ContextCompat.registerReceiver(
                      this, stateReceiver, IntentFilter(VibeService.ACTION_STATE),
                      ContextCompat.RECEIVER_NOT_EXPORTED
                  )
                  refreshUi()
              }

              override fun onStop() {
                  unregisterReceiver(stateReceiver)
                  super.onStop()
              }
          }
          EOF_SV
          mkdir -p "$(dirname 'app/src/main/java/com/example/soundvibe/VibeService.kt')"
          cat > 'app/src/main/java/com/example/soundvibe/VibeService.kt' <<'EOF_SV'
          package com.example.soundvibe

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioPlaybackCaptureConfiguration
          import android.media.AudioRecord
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.IBinder
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import androidx.core.app.NotificationCompat
          import kotlin.math.sqrt

          class VibeService : Service() {

              private var projection: MediaProjection? = null
              private var recorder: AudioRecord? = null
              private var worker: Thread? = null
              @Volatile private var running = false

              private lateinit var vibrator: Vibrator

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  vibrator = if (Build.VERSION.SDK
